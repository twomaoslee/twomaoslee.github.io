<script>
(() => {
  const report = () => {
    const slides = Array.from(document.querySelectorAll('.deck > .slide'));
    parent.postMessage({type:'wave-example-state',current:slides.findIndex(s=>s.classList.contains('is-active'))+1,total:slides.length}, '*');
  };
  window.addEventListener('message', event => {
    if (event.source !== parent || event.data?.type !== 'wave-example-key') return;
    const key = event.data.key;
    if (!['ArrowLeft','ArrowRight','Home'].includes(key)) return;
    document.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}));
  });
  document.addEventListener('keydown', () => queueMicrotask(report));
  document.addEventListener('DOMContentLoaded', () => {
    new MutationObserver(report).observe(document.querySelector('.deck'),{subtree:true,attributes:true,attributeFilter:['class']});
    report();
  }, {once:true});
})();
</script>
