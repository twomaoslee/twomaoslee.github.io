<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自由演化的布洛赫球轨迹</title>
<link rel="stylesheet" href="https://zimin.li/slides/ai-teaching/assets/course-showcase/notes/assets/vendor/katex/katex.min.css"><link rel="stylesheet" href="https://zimin.li/slides/ai-teaching/assets/course-showcase/notes/assets/lecture03/bloch.css">
<script defer="" src="https://zimin.li/slides/ai-teaching/assets/course-showcase/notes/assets/vendor/katex/katex.min.js"></script><script defer="" src="https://zimin.li/slides/ai-teaching/assets/course-showcase/notes/assets/lecture03/figure-print.js"></script><script defer="" src="https://zimin.li/slides/ai-teaching/assets/course-showcase/notes/assets/lecture03/bloch.js"></script>
</head><body data-kind="free">
<main id="slide" aria-label="自由演化轨迹与测量概率的16比9交互图">
<header><h1>自由演化：沿纬线转动</h1><div class="tools"><button id="reset">重置</button><button id="fullscreen">全屏</button></div></header>
<svg id="sphere" viewBox="0 0 660 500" role="img" aria-label="沿赤道转动的状态或停在北极的能量态"></svg>
<svg id="prob-chart" viewBox="0 0 510 500" role="img" aria-label="0与1测量的概率和正叠加态测量的概率随时间变化"></svg>
<div class="controls time-controls"><div class="initial"><span>初态</span><button data-initial="plus" data-math="|+\rangle"></button><button data-initial="0" data-math="|0\rangle"></button></div><button id="play" aria-label="播放自由演化">播放</button><label><span data-math="t/T"></span><input id="time" type="range" min="0" max="1" step="0.001" value="0.25" aria-label="等待时间占周期的比例"><output id="time-value"></output></label><span class="period" data-math="\displaystyle T=\frac{2\pi\hbar}{\Delta E}"></span></div>
</main>
</body></html>
