<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0070c0">
<meta name="description" content="中国物理学会2026秋季学术会议日程：按日期、分会场和关键词查找报告，收藏并安排我的日程。">
<title>会议日程 · 中国物理学会2026秋季学术会议</title>
<link rel="canonical" href="https://zimin.li/agenda/">
<link rel="stylesheet" href="./agenda.css?v=2960e0dc25">
<script src="./conference-data.js?v=2960e0dc25" defer></script>
<script src="./agenda-model.js?v=2960e0dc25" defer></script>
<script src="./agenda.js?v=2960e0dc25" defer></script>
</head>
<body>
<main class="app" id="app">
<header class="conference-header">
<p class="conference-name">中国物理学会2026秋季学术会议</p>
<button id="back-home" class="back-home" type="button" hidden>← 分会场首页</button>
<div class="title-line"><h1 id="page-title">选择分会场</h1><span id="saved-total" class="saved-total"></span></div>
<p id="venue" class="venue" hidden></p>
<p id="summary" class="summary">正在加载日程…</p>
<button id="venue-favorite" class="venue-favorite" type="button" hidden></button>
<details id="track-info" class="track-info" hidden><summary>分会信息</summary><div id="track-info-body"></div></details>
</header>
<div id="storage-warning" role="alert" class="warning" hidden></div>
<section id="home-view" aria-label="分会场入口"><section id="saved-venues" hidden><h2 class="directory-heading">收藏的分会场</h2><div id="saved-entries" class="track-entries"></div></section><h2 id="all-venues-heading" class="directory-heading" hidden>全部分会</h2><div id="track-entries" class="track-entries"></div><button id="show-all" class="show-all" type="button">查看全部日程 →</button></section>
<section id="department-view" aria-label="子会场入口" hidden><div id="child-entries" class="child-entries"></div></section>
<div id="schedule-view" hidden>
<section class="filters-bar" aria-label="筛选日程">
<div id="kind-tabs" class="kind-tabs" role="group" aria-label="报告类型"></div>
<div id="date-tabs" class="date-tabs" role="group" aria-label="日期"></div>
<div class="filter-controls"><label class="visually-hidden" for="track">分会场</label><select id="track" aria-label="分会场"><option value="">全部分会场</option></select><label class="visually-hidden" for="search">搜索题目、编号、讲者或主持人</label><input id="search" type="search" enterkeyhint="search" placeholder="题目 / 编号 / 讲者 / 主持人" autocomplete="off"></div>
<div class="filter-footer"><span id="result-count" role="status" aria-live="polite"></span><button id="clear" class="text-button" type="button">清除筛选</button></div>
</section>
<p id="conflict-warning" class="warning" hidden></p>
<section id="results" aria-label="报告列表"></section>
<div id="empty" class="empty" hidden><h2 id="empty-title"></h2><p id="empty-help"></p></div>
<nav id="pager" class="pager" aria-label="按日翻页" hidden><button id="previous" type="button">上一天</button><span id="page-number"></span><button id="next" type="button">下一天</button></nav>
</div>
<footer class="footnote"><p id="source">会议手册全部分会 · L会场最新版Excel</p><p>收藏保存在此浏览器；换设备、换浏览器或清除数据后不会同步。</p><p class="credit">Developed by <a href="/zh/">李梓民</a></p></footer>
<noscript><p class="warning">请启用浏览器的 JavaScript 功能，以查看会议日程。</p></noscript>
</main>
<nav class="bottom-nav" aria-label="主导航"><div><button id="tab-home" type="button" aria-current="page">分会场</button><button id="tab-mine" type="button">我的日程 <span id="mine-badge"></span></button></div></nav>
<div id="detail-layer" class="detail-layer" hidden><section id="detail" class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1"><div class="detail-toolbar"><span>报告详情</span><button id="close-detail" type="button" aria-label="关闭报告详情">关闭 ✕</button></div><div id="detail-body"></div></section></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
