{{ if .IsHome }}
{{ $zh := eq .Lang "zh" }}
{{ $css := resources.Get "css/home-visits.css" | minify | fingerprint }}
{{ $js := resources.Get "js/home-visits.js" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
<p class="powered-by home-visits" id="home-visits" hidden
   data-url="{{ site.BaseURL }}"
   data-unavailable="{{ cond $zh "访问统计暂不可用" "Visit count unavailable" }}"
   data-cached="{{ cond $zh "最近一次成功获取的累计访问次数" "Last successfully retrieved visit count" }}">
  <i class="fas fa-eye" aria-hidden="true"></i>
  <span>{{ if $zh }}主页累计访问 <span data-visit-count>—</span> 次{{ else }}Homepage views: <span data-visit-count>—</span>{{ end }}</span>
  <span class="sr-only" data-visit-status role="status"></span>
</p>
<script src="{{ $js.RelPermalink }}" defer></script>
{{ end }}
